name: Обновить вакансии и сайт

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: radar-pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Найти папку проекта
        id: project
        shell: bash
        run: |
          if [ -f montage-radar/collector.py ]; then
            echo "dir=montage-radar" >> "$GITHUB_OUTPUT"
          elif [ -f collector.py ]; then
            echo "dir=." >> "$GITHUB_OUTPUT"
          else
            echo "Не найден collector.py. Проверьте загрузку распакованного проекта."
            exit 1
          fi

      - name: Проверить правила
        working-directory: ${{ steps.project.outputs.dir }}
        run: python -m unittest discover -s tests -v

      - name: Собрать вакансии
        id: collect
        continue-on-error: true
        working-directory: ${{ steps.project.outputs.dir }}
        run: python collector.py

      - name: Сохранить обновления
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data/jobs.json
          if ! git diff --cached --quiet; then
            git commit -m "Update vacancies"
            git push
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.project.outputs.dir }}/site

      - name: Опубликовать сайт
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Сообщить об ошибке сбора
        if: steps.collect.outcome == 'failure'
        run: |
          echo "Сбор не удался. Сайт опубликован с прежними данными."
          exit 1
